<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>buenavida</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0f172a; font-family: sans-serif; color: white; }
    #bar { padding: 20px; text-align: center; }
    #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 20px; }
    .card { width: 220px; padding: 24px 0; border-radius: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    .card p { margin: 10px 0; }
    .gold   { background: linear-gradient(135deg, #fde68a, #d4a017); color: #422006; }
    .silver { background: linear-gradient(135deg, #f1f5f9, #94a3b8); color: #1e293b; }
    .name   { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
    .price  { font-size: 32px; font-weight: bold; }
    .change { text-shadow: 1px 1px 0 black; }
    .up   .change { color: #4ade80; }
    .down .change { color: #f87171; }
  </style>
</head>
<body>
  <div id="bar">
    Currency:
    <select id="currency">
      <option>MAD</option>
      <option>EUR</option>
      <option>USD</option>
    </select>
    (per oz)
  </div>
  <div id="cards"></div>

  <script>
    const RATES = { USD: 1, MAD: 9.75, EUR: 0.86 };
    const METALS = { XAU: ["Gold", "gold"], XAG: ["Silver", "silver"] };
    let memory = {}, data = [];

    try { memory = JSON.parse(localStorage.memory); } catch {}

    async function update() {
      data = (await Promise.all(Object.entries(METALS).map(async ([sym, [name, cls]]) => {
        try {
          const { price } = await (await fetch("https://api.gold-api.com/price/" + sym)).json();
          const m = memory[sym] ||= { price, previous: price };
          if (price !== m.price) [m.previous, m.price] = [m.price, price];
          return { name, cls, ...m };
        } catch {}
      }))).filter(Boolean);

      try { localStorage.memory = JSON.stringify(memory); } catch {}
      render();
    }

    function render() {
      const rate = RATES[currency.value];
      cards.innerHTML = data.map(({ name, cls, price, previous }) => {
        const diff = price - previous;
        const pct = previous ? diff / previous * 100 : 0;
        const up = diff >= 0, sign = up ? "+" : "";
        return `
          <div class="card ${cls} ${up ? "up" : "down"}">
            <p class="name">${name}</p>
            <p class="price">${(price * rate).toFixed(2)}</p>
            <p class="change">${up ? "▲" : "▼"} ${sign}${(diff * rate).toFixed(2)} (${sign}${pct.toFixed(2)}%)</p>
          </div>`;
      }).join("");
    }

    currency.onchange = render;
    update();
    setInterval(update, 10000);
  </script>
</body>
</html>
