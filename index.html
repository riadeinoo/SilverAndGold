<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>buenavida</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      font-family: sans-serif;
      color: white;
    }
    #bar { padding: 20px; text-align: center; }
    #cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 20px;
    }
    .card {
      width: 220px;
      padding: 24px 0;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .gold {
  background: linear-gradient(135deg, #fde68a, #d4a017);
  color: #422006;
}
.silver {
  background: linear-gradient(135deg, #f1f5f9, #94a3b8);
  color: #1e293b;
}

    .name  { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
    .price { font-size: 32px; font-weight: bold; margin: 0; }
    .change { font-size: 16px; margin: 0; text-shadow:
     1px 1px 0 black,
     1px 1px 0 black,
     1px 1px 0 black,
     1px 1px 0 black;
}
    .up   .change { color: #4ade80; }
    .down .change { color: #f87171; }
  </style>
</head>
<body>
  <div id="bar">
    Currency:
    <select id="currency">
      <option value="MAD">MAD</option>
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
    </select>
    (per oz)
  </div>

  <div id="cards"></div>

  <script>
    const RATES = { USD: 1, MAD: 9.75, EUR: 0.86 };
    const METALS = [
      { symbol: "XAU", name: "Gold", cls: "gold" },
      { symbol: "XAG", name: "Silver", cls: "silver" }
    ];
    let data = [];  
    let memory = {};

    try { memory = JSON.parse(localStorage.getItem("memory")) || {}; } catch (e) {}

    async function fetchAll() {
      const results = await Promise.all(METALS.map(async m => {
        try {
          const res = await fetch("https://api.gold-api.com/price/" + m.symbol);
          const json = await res.json();
          const price = json.price;
          const mem = memory[m.symbol] || { price: price, previous: price };
          if (price !== mem.price) {
            mem.previous = mem.price;
            mem.price = price;
          }
          memory[m.symbol] = mem;

          return { name: m.name, cls: m.cls, price: mem.price, previous: mem.previous };
        } catch (e) {
          return null;
        }
      }));

      data = results.filter(Boolean);
      try { localStorage.setItem("memory", JSON.stringify(memory)); } catch (e) {}
      render();
    }

    function render() {
      const rate = RATES[document.getElementById("currency").value];
      document.getElementById("cards").innerHTML = data.map(item => {
        const price  = item.price * rate;
        const change = (item.price - item.previous) * rate;
        const pct    = item.previous ? (item.price - item.previous) / item.previous * 100 : 0;
        const up     = change >= 0;
        const arrow  = up ? "▲" : "▼";
        const sign   = up ? "+" : "";

        return `
          <div class="card ${item.cls} ${up ? "up" : "down"}">
            <p class="name">${item.name}</p>
            <p class="price">${price.toFixed(2)}</p>
            <p class="change">${arrow} ${sign}${change.toFixed(2)} (${sign}${pct.toFixed(2)}%)</p>
          </div>`;
      }).join("");
    }

    document.getElementById("currency").addEventListener("change", render);

    fetchAll();
    setInterval(fetchAll, 10000);
  </script>
</body>
</html>
